# Builds the Android app on every push to main (and by hand), and publishes the APK as the release
# v<appVersion> (android/gradle.properties), marked Latest, the page the app's title opens.
# Signing: the APK is signed with the keystore in the secret ANDROID_DEBUG_KEYSTORE_B64 (base64 of the Mac's
# ~/.android/debug.keystore), so a CI build installs over a Mac build and over the one before it. Without that
# secret the runner's fresh debug key signs it: it then installs only after the old app is uninstalled.
name: Android APK  # TEMPLATE android-gradle.yml from MANTRA_MANIFEST/workflows (source: MANTRA_REMOTE_VNC_TAILSCALE v26)

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"   # app/build.gradle.kts reads it
            echo "Signing with the saved debug keystore."
          else
            echo "::warning::No ANDROID_DEBUG_KEYSTORE_B64 secret: signed with a fresh key, will not install over an older build."
          fi

      - name: Version
        id: v
        run: echo "n=$(grep '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apk-v${{ steps.v.outputs.n }}
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Release v${{ steps.v.outputs.n }}
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.v.outputs.n }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          if gh release view "v$N" >/dev/null 2>&1; then
            gh release upload "v$N" "$APK" --clobber
          else
            gh release create "v$N" "$APK" --target "$GITHUB_SHA" --latest \
              --title "v$N" --notes "Built by GitHub Actions from $GITHUB_SHA. $(git log -1 --format=%s)"
          fi
